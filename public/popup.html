<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <header>
        <h1>QA Tools</h1>
    </header>
    <main>
        <section>
            <div  class="settings section">
                <span>Settings</span>
                <small>Highlight Data Automation Id's</small>
                <button id="highlightBtn">Enable</button>
            </div>
            <div class="actions section">
                <span>Actions</span>
                <small>Get Patient Info</small>
                <button id="getPatientInfo">Get</button>
            </div>
            <div class="actions section">
                <span>Actions</span>
                <small>Random Patient Data</small>
                <button id="randomPatientDataBtn">Generate</button>
            </div>
            <div class="actions section">
                <span>Actions</span>
                <small>Add Historic Immunizations</small>
                <button id="addHistoricImmunizationsBtn">Add</button>
            </div>

        </section>
    </main>
    <footer>
        <p>This tool was created to facilitate QA work</p>
    </footer>
    <script type="module" src="popup.js"></script>
</body>

</html>
